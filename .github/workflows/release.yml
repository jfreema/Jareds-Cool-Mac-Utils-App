name: Release

# Every push to main that changes the app publishes it as a new version: this tests, builds, signs and checks it, then
# commits the installer, the update feeds in downloads/, the version in Resources/Info.plist and the README's version
# line to main, which is where Check for Updates looks. The last number of the version goes up by itself, unless the
# push raised the version already, as for a new feature. Run it by hand from the Actions tab to try a build without
# publishing.

on:
  push:
    branches: [main]
    # The app's own files. Docs, tests and the art scripts alone don't make a new version.
    paths: [Sources/**, Resources/**, Package.swift, build.sh, '!Resources/*.swift']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish, if the app changed since the last release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90  # notarizing a release can wait up to an hour
    env:
      # The Apple Developer team behind every grant users have given the app since 1.1.6. Another team would look like
      # a different app to macOS, and Check for Updates refuses it, so a release signed by anyone else stops here.
      TEAM_ID: 885XHF7XLL
    steps:
      - uses: actions/checkout@v5
        with:
          # A push builds main as it is now, so a run that waited for the one before takes in every push since
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}
          fetch-depth: 0  # for the last release, and so Publish can rebase onto anything pushed meanwhile

      - name: Pick the version
        id: version
        run: |
          plist=Resources/Info.plist
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")"
          published="$(plutil -extract version raw -o - downloads/update.json)"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The commit the published installer was built from. Releases before 1.1.12 don't say, so their own.
          release="$(git log -1 --format=%H -- downloads/update.json)"
          built="$(git log -1 --format=%B "$release" | sed -n 's/^Built from //p')"
          built="${built:-$release}"
          # Whether the app changed since: its files, and Info.plist apart from the version
          for commit in "$built" HEAD; do
            git show "$commit:$plist" > "$RUNNER_TEMP/$commit.plist"
            plutil -remove CFBundleShortVersionString "$RUNNER_TEMP/$commit.plist"
          done
          changed=false
          if ! git diff --quiet "$built" HEAD -- Sources Package.swift build.sh Resources \
              ":(exclude)$plist" ':(exclude)Resources/*.swift' \
              || ! cmp -s "$RUNNER_TEMP/$built.plist" "$RUNNER_TEMP/HEAD.plist"; then
            changed=true
          fi
          # A version raised by hand, as for a new feature, goes out as it is. Otherwise the last number goes up.
          next="$version"
          if [[ "$version" == "$published" && $changed == true ]]; then
            next="${version%.*}.$(( ${version##*.} + 1 ))"
          fi
          echo "Info.plist says $version, $published is published, and the app changed since $built: $changed"
          if [[ "$next" != "$published" && "${{ github.event_name == 'push' || inputs.publish }}" == true ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $next" "$plist"
            echo "Publishing $next"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$next" != "$published" ]]; then echo "Publishing would make it $next"; fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: |
          swift --version
          swift test

      - name: Import the Developer ID certificates
        env:
          # Developer ID Application signs the app, and Developer ID Installer the installer
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$APP_P12" || -z "$INSTALLER_P12" || -z "$P12_PASSWORD" ]]; then
            echo "::error::Add the Developer ID secrets with scripts/setup-signing.sh. See docs/buildfromsource.md."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for p12 in APP_P12 INSTALLER_P12; do
            echo "${!p12}" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/signing.p12"
          done
          # Uses them without asking: nobody is here to answer
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$keychain"

      - name: Build, sign and notarize
        env:
          # Test runs notarize too. They wait 15 minutes for Apple, then carry on unnotarized. A release waits an hour,
          # then stops rather than publish an unnotarized installer.
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TIMEOUT: ${{ steps.version.outputs.publish == 'true' && '60m' || '15m' }}
          NOTARY_REQUIRED: ${{ steps.version.outputs.publish == 'true' && '1' || '' }}
        run: ./build.sh --pkg

      - name: Check it as Check for Updates will
        run: |
          version="${{ steps.version.outputs.version }}"
          # The installer update.json names
          pkg="downloads/$(basename "$(plutil -extract url raw -o - downloads/update.json)")"
          expanded="$RUNNER_TEMP/expanded"
          pkgutil --expand-full "$pkg" "$expanded"
          # By bundle ID, as Check for Updates finds it, since the name can change
          app=""
          while IFS= read -r candidate; do
            plist="$candidate/Contents/Info.plist"
            id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist" 2>/dev/null || true)"
            if [[ "$id" == io.github.jfreema.yafie ]]; then app="$candidate"; break; fi
          done < <(find "$expanded" -name '*.app' -maxdepth 3)
          test -n "$app" || { echo "::error::No io.github.jfreema.yafie app in $pkg"; exit 1; }
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "$version"
          codesign --verify --strict "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID" \
            || { echo "::error::The app isn't signed by team $TEAM_ID"; exit 1; }
          pkgutil --check-signature "$pkg" | grep -q "Developer ID Installer: .*($TEAM_ID)" \
            || { echo "::error::The installer isn't signed by team $TEAM_ID"; exit 1; }
          if xcrun stapler validate "$pkg"; then
            spctl --assess --type install --verbose "$pkg"
          elif [[ "${{ steps.version.outputs.publish }}" == true ]]; then
            echo "::error::$pkg isn't notarized"; exit 1
          fi
          test "$(plutil -extract version raw -o - downloads/update.json)" = "$version"
          test "$(plutil -extract sha256 raw -o - downloads/update.json)" = "$(shasum -a 256 "$pkg" | cut -d' ' -f1)"
          # Copies before 1.1.3 read latest.json and only take Yafie.app, so it and Yafie.pkg stay at 1.1.3 for good
          test "$(plutil -extract version raw -o - downloads/latest.json)" = 1.1.3
          git diff --quiet -- downloads/latest.json downloads/Yafie.pkg \
            || { echo "::error::downloads/latest.json and downloads/Yafie.pkg must stay at 1.1.3"; exit 1; }
          echo "downloads/update.json points to $pkg, and latest.json stays at 1.1.3"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")"
          echo "$(basename "$app") $version for $(lipo -archs "$app/Contents/MacOS/$executable") checks out"

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: jaredsmacutils-${{ steps.version.outputs.version }}
          path: |
            downloads/*.pkg
            downloads/*.json

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads README.md Resources/Info.plist
          git commit -m "Release ${{ steps.version.outputs.version }}" \
            -m "Built from ${{ steps.version.outputs.source }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
